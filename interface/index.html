<!DOCTYPE html>

<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

```
<title>Telemed Secure</title>

<link rel="stylesheet" href="style.css">
```

</head>

<body class="page-authentification">

```
<main class="conteneur-authentification">

    <section class="carte-authentification">

        <div class="logo-telemed">
            ✚
        </div>

        <h1>Telemed Secure</h1>

        <p class="sous-titre">
            Bienvenue
        </p>


        <form id="connexion-form">

            <div class="champ">

                <label for="identifiant">
                    Adresse e-mail ou numéro de téléphone
                </label>

                <input
                    type="text"
                    id="identifiant"
                    name="identifiant"
                    autocomplete="username"
                    placeholder="Votre e-mail ou numéro"
                    required
                >

            </div>


            <div class="champ">

                <label for="mot_de_passe">
                    Mot de passe
                </label>

                <input
                    type="password"
                    id="mot_de_passe"
                    name="mot_de_passe"
                    autocomplete="current-password"
                    placeholder="Votre mot de passe"
                    required
                >

            </div>


            <button type="submit">
                Se connecter
            </button>


            <p
                id="message-connexion"
                class="message">
            </p>


            <div class="actions-secondaires-connexion">

                <a
                    href="mot-de-passe-oublie.html"
                    class="lien-secondaire">
                    Mot de passe oublié ?
                </a>

                <a
                    href="inscription.html"
                    class="lien-secondaire">
                    Créer un compte
                </a>

            </div>

        </form>

    </section>

</main>


<script src="connexion.js"></script>
```

</body>

</html>
