<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vérification MFA - Telemed Secure</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Telemed Secure</h1>
        <p>Vérification de sécurité</p>
    </header>

    <main>
        <h2>Vérification MFA</h2>

        <p>
            Une deuxième vérification est nécessaire
            pour accéder à votre compte.
        </p>

        <section class="carte">
            <h3>🔐 Authenticator</h3>

            <p>
                Saisissez le code à 6 chiffres généré
                par votre application d'authentification.
            </p>

            <label for="code-authenticator">
                Code Authenticator
            </label>

            <input
                type="text"
                id="code-authenticator"
                maxlength="6"
                minlength="6"
                inputmode="numeric"
                pattern="[0-9]{6}"
                autocomplete="one-time-code"
                placeholder="Code à 6 chiffres"
            >

            <button id="bouton-authenticator" type="button">
                Vérifier
            </button>
        </section>

        <p id="message-mfa"></p>

    </main>

    <script src="verification-mfa.js"></script>

</body>
</html>
