<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Vérification MFA | Telemed Secure</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>

    <div class="entete-marque">
        <div class="logo-telemed">+</div>

        <div class="identite-site">
            <h1>Telemed Secure</h1>
            <p>Vérification de sécurité</p>
        </div>
    </div>

</header>

<main>

    <section class="formulaire-carte mfa-page">

        <div style="text-align:center;">

            <div class="icone-module" style="margin:0 auto 18px;">
                🔐
            </div>

            <h2>Vérification MFA</h2>

            <p>
                Une deuxième vérification est nécessaire
                avant d'accéder à votre compte.
            </p>

        </div>

        <div class="mfa-introduction">
            Entrez le code à 6 chiffres généré par votre
            application d'authentification.
        </div>

        <section style="margin-top:25px;">

            <label for="code-authenticator">
                Code Authenticator
            </label>

            <input
                class="mfa-code"
                type="text"
                id="code-authenticator"
                maxlength="6"
                minlength="6"
                inputmode="numeric"
                pattern="[0-9]{6}"
                autocomplete="one-time-code"
                placeholder="000000"
            >

            <button
                id="bouton-authenticator"
                type="button"
                style="width:100%; margin-top:15px;"
            >
                Vérifier le code
            </button>

        </section>

        <p id="message-mfa"></p>

    </section>

</main>

<script src="verification-mfa.js"></script>

</body>
</html>
