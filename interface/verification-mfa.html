<!DOCTYPE html>

<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vérification MFA | Telemed Secure</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="page-authentification">

```
<main class="conteneur-authentification">

    <section class="carte-authentification">

        <div class="logo-telemed">✚</div>

        <h1>Telemed Secure</h1>

        <p class="sous-titre">
            Vérification de sécurité
        </p>

        <div class="bloc-mfa">

            <div class="icone-module">
                🔐
            </div>

            <div>
                <h2>Authentification multifacteur</h2>

                <p>
                    Vérifiez votre identité pour continuer.
                </p>
            </div>

        </div>

        <form id="mfa-form">

            <div class="champ">

                <label for="code-mfa">
                    Code de vérification
                </label>

                <input
                    type="text"
                    id="code-mfa"
                    name="code-mfa"
                    placeholder="000000"
                    inputmode="numeric"
                    maxlength="6"
                    pattern="[0-9]{6}"
                    autocomplete="one-time-code"
                    required
                >

            </div>

            <button type="submit">
                Vérifier le code
            </button>

            <p id="message-mfa" class="message"></p>

        </form>

        <div class="bloc-protection">

            <div class="icone-protection">
                🛡️
            </div>

            <div>
                <strong>Protection renforcée</strong>

                <p>
                    Une deuxième vérification est nécessaire
                    pour accéder à votre espace sécurisé.
                </p>
            </div>

        </div>

        <div class="lien-inscription">

            <a href="index.html">
                ← Retour à la connexion
            </a>

        </div>

    </section>

</main>

<script src="verification-mfa.js?v=2"></script>


</body>
</html>
