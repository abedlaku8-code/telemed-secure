<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Créer un compte | Telemed Secure</title>

    <link rel="stylesheet" href="style.css">
</head>

<body class="page-connexion">

    <main class="conteneur-connexion">

        <section class="carte-connexion">

            <div class="logo-securite">
                <div class="icone-logo">✚</div>

                <div>
                    <h1>Telemed Secure</h1>
                    <p>Télémédecine simulée et sécurisée</p>
                </div>
            </div>

            <div class="entete-connexion">
                <h2>Créer un compte</h2>

                <p>
                    Renseignez vos informations pour créer votre espace sécurisé.
                </p>
            </div>

            <form id="inscription-form">

                <div class="champ">
                    <label for="nom">Nom</label>

                    <input
                        type="text"
                        id="nom"
                        name="nom"
                        placeholder="Votre nom"
                        autocomplete="family-name"
                        required
                    >
                </div>

                <div class="champ">
                    <label for="prenom">Prénom</label>

                    <input
                        type="text"
                        id="prenom"
                        name="prenom"
                        placeholder="Votre prénom"
                        autocomplete="given-name"
                        required
                    >
                </div>

                <div class="champ">
                    <label for="email">Adresse e-mail</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="exemple@telemed.local"
                        autocomplete="email"
                        required
                    >
                </div>

                <div class="champ">
                    <label for="telephone">Numéro de téléphone</label>

                    <input
                        type="tel"
                        id="telephone"
                        name="telephone"
                        placeholder="+243..."
                        autocomplete="tel"
                        required
                    >
                </div>

                <div class="champ">
                    <label for="mot_de_passe">Mot de passe</label>

                    <input
                        type="password"
                        id="mot_de_passe"
                        name="mot_de_passe"
                        placeholder="Minimum 8 caractères"
                        autocomplete="new-password"
                        required
                    >
                </div>

                <div class="champ">
                    <label for="confirmation_mot_de_passe">
                        Confirmer le mot de passe
                    </label>

                    <input
                        type="password"
                        id="confirmation_mot_de_passe"
                        name="confirmation_mot_de_passe"
                        placeholder="Répétez votre mot de passe"
                        autocomplete="new-password"
                        required
                    >
                </div>

                <div class="champ">
                    <label for="role">Type de compte</label>

                    <select
                        id="role"
                        name="role"
                        required
                    >
                        <option value="">
                            Sélectionnez votre profil
                        </option>

                        <option value="patient">
                            Patient
                        </option>

                        <option value="medecin">
                            Médecin
                        </option>
                    </select>
                </div>

                <button
                    type="submit"
                    class="bouton-principal"
                >
                    Créer mon compte
                </button>

                <p
                    id="message-inscription"
                    class="message"
                    aria-live="polite"
                ></p>

            </form>

            <div class="information-securite">

                <span class="icone-cadenas">🔐</span>

                <div>
                    <strong>Protection de vos informations</strong>

                    <p>
                        Votre mot de passe est protégé avant son enregistrement.
                    </p>
                </div>

            </div>

            <div class="retour-connexion">

                <a href="index.html">
                    ← Retour à la connexion
                </a>

            </div>

            <footer class="pied-connexion">

                <p>
                    Telemed Secure — Projet académique
                </p>

            </footer>

        </section>

    </main>

    <script src="inscription.js"></script>

</body>
</html>
